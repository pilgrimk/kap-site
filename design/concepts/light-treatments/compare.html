<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light treatments comparison</title>
<!-- Review aid: one treatment at a time, full size, in a full-viewport frame so each keeps its
     real breakpoints. Keys 1-3 switch, R replays the workflow animation. -->
<style>
  html, body { margin: 0; height: 100%; background: #fffced; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage iframe { display: block; width: 100%; height: 100%; border: 0; }
  .switch { position: fixed; z-index: 10; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(26, 26, 26, .86); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
  .switch button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, .62); font: 13px/1 system-ui, sans-serif; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: rgba(255, 255, 255, .16); color: #fff; }
  .switch button:focus-visible { outline: 2px solid rgba(255, 255, 255, .5); outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="switch" role="group" aria-label="Treatment">
  <button data-t="ivory">1 Warm Ivory</button>
  <button data-t="balanced">2 Balanced Contrast</button>
  <button data-t="optimism">3 Modern Optimism</button>
  <button data-replay aria-label="Replay animation (R)">↻</button>
</div>
<script>
  const themes = ['ivory', 'balanced', 'optimism'];
  const stage = document.getElementById('stage');
  const buttons = [...document.querySelectorAll('[data-t]')];
  let current = Math.max(0, themes.indexOf(new URLSearchParams(location.search).get('t')));

  function show(i) {
    current = i;
    buttons.forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
    const url = new URL(location); url.searchParams.set('t', themes[i]); history.replaceState(null, '', url);
    stage.innerHTML = `<iframe src="index.html?theme=${themes[i]}" title="Treatment ${i + 1}"></iframe>`;
    const f = stage.querySelector('iframe');
    f.addEventListener('load', () => { try { f.contentDocument.addEventListener('keydown', onKey); } catch (_) {} });
  }
  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 3) show(n - 1);
    else if (e.key === 'r' || e.key === 'R') show(current);
  }
  buttons.forEach((b, i) => b.addEventListener('click', () => show(i)));
  document.querySelector('[data-replay]').addEventListener('click', () => show(current));
  document.addEventListener('keydown', onKey);
  show(current);
</script>
</body>
</html>
